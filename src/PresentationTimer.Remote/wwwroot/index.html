<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#141b26">
  <title>Presentation Timer Remote</title>
  <link rel="stylesheet" href="/assets/presenter.css">
</head>
<body>
  <main class="presenter-shell">
    <header class="topbar">
      <div class="identity">
        <span class="identity-mark" aria-hidden="true"></span>
        <span id="app-name">Presentation Timer</span>
      </div>
      <div id="language-control" class="language-control">
        <button id="language-toggle" class="language-toggle" type="button" aria-expanded="false" aria-controls="language-popover">
          <span id="language-label" class="sr-only">Language</span>
          <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <circle cx="12" cy="12" r="9"></circle>
            <path d="M3 12h18M12 3c2.5 2.5 3.8 5.5 3.8 9s-1.3 6.5-3.8 9M12 3c-2.5 2.5-3.8 5.5-3.8 9s1.3 6.5 3.8 9"></path>
          </svg>
        </button>
        <div id="language-popover" class="language-popover" hidden>
          <p id="language-heading">Language</p>
          <button class="language-option" type="button" data-locale="en" lang="en"><span>English</span></button>
          <button class="language-option" type="button" data-locale="zh-CN" lang="zh-CN"><span>简体中文</span></button>
          <button class="language-option" type="button" data-locale="zh-TW" lang="zh-TW"><span>繁體中文</span></button>
          <button class="language-option" type="button" data-locale="ja" lang="ja"><span>日本語</span></button>
          <button class="language-option" type="button" data-locale="es" lang="es"><span>Español</span></button>
          <button class="language-option" type="button" data-locale="fr" lang="fr"><span>Français</span></button>
          <button class="language-option" type="button" data-locale="de" lang="de"><span>Deutsch</span></button>
        </div>
      </div>
    </header>
    <div class="session-line">
      <p id="connection" class="connection" role="status" data-state="connecting">Connecting…</p>
      <p id="slide-position" class="slide-position">Slide — / —</p>
    </div>
    <section class="timer" aria-live="polite" aria-atomic="true">
      <span id="timer-mode" class="timer-label">Remaining</span>
      <strong id="timer-value">00:00</strong>
      <span class="timer-rule" aria-hidden="true"></span>
    </section>
    <section class="notes-panel" aria-labelledby="notes-heading">
      <h1 id="notes-heading">Speaker notes</h1>
      <p id="notes" class="notes is-empty">No speaker notes on this slide.</p>
    </section>
    <nav class="navigation" aria-label="Slide navigation">
      <button id="previous" type="button" disabled><span aria-hidden="true">←</span><span class="button-label">Previous</span></button>
      <button id="next" type="button" disabled><span class="button-label">Next</span><span aria-hidden="true">→</span></button>
    </nav>
  </main>
  <script src="/vendor/signalr.min.js"></script>
  <script src="/assets/presenter.js"></script>
</body>
</html>
